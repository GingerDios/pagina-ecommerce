
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freshly!</title>
    <link rel="stylesheet" href="transaccion.css">
    <link rel="stylesheet" href="headerfooter.css">
</head>
<body>
    <header class="navbar">
        <div class="logo"><a href="index.html"><img src="fotos/logo.png" alt=""></a></div>
        <div class="espacio">
            <input type="text" class="busqueda" placeholder="Buscar">
        </div>
        <div class="buscar"><a href="#"><img src="buscarsimbolo.png" alt="buscador"></a></div>
        <div class="inicio"><a href="index.html">Home</a></div>
        <div class="categorias"><a href="categorias.html">Products</a></div>
        <a href="carrito.html"><div class="carrito" id="carrito"><img src="carrito.png" alt=""><p id="compras">0</p></div></a>
        
    </header>

    <main class="contenido">
        <div class="ventana">
            <h2>Pay method</h2>
            
            <form class="formulario">
                <div class="campo">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="user@mail.com">
                </div>

                <div class="campo">
                    <label for="tarjeta">Card number</label>
                    <input type="text" id="tarjeta" placeholder="0000 0000 0000 0000">
                </div>

                <div class="fila-doble">
                    <div class="campo">
                        <label for="vencimiento">Expiration date</label>
                        <input type="text" id="vencimiento" placeholder="MM/YY">
                    </div>
                    <div class="campo">
                        <label for="cvv">CVV</label>
                        <input type="password" id="cvv" placeholder="123">
                    </div>
                </div>

                <div class="campo">
                    <label for="nombre">Name</label>
                    <input type="text" id="nombre" placeholder="Name Lastname">
                </div>

                <div class="campo">
                    <label for="direccion">Mailing adress</label>
                    <input type="text" id="direccion" placeholder="street, city">
                </div>

                <a href="completo.html"><button type="button" class="pagar">confirm payment</button></a>
            </form>
        </div>
    </main>

    <footer>
              <div class="footer-contenido">
                <div class="footerinfo">
        <h2>Freshly!</h2>
        <p>Your soda distributor</p>
                </div>

        <div class="footer-links">
            <a href="index.html">Home</a>
            <a href="categorias.html">Categories</a>
            <a href="#">Contact us</a>
        </div>

        <p class="copyright">© 2026 Freshly! - All rights reserved</p>
    </div>
        </footer>


        <script src="buscar.js"></script>
</body>
</html>
